<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF3E0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#EA580C" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle with Shadow -->
  <rect width="64" height="64" rx="18" fill="url(#shieldGrad)"/>
  
  <!-- Inner Subtle Hex Shield Outline -->
  <path d="M32 10L14 18V31C14 42.5 21.8 51.5 32 54C42.2 51.5 50 42.5 50 31V18L32 10Z" 
        fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
        
  <!-- Precision Lightning Bolt / Spark Node -->
  <path d="M34 16L23 32H32L29 46L42 30H33L34 16Z" 
        fill="url(#boltGrad)" stroke="#E65100" stroke-width="1.2" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
